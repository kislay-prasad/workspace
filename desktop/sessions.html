<!doctype html><meta charset="utf-8"><title>LANChat sessions</title>
<style>
:root{--brand:#5b5fc7;--line:#d9d9e4;--muted:#6b6b7b}
@media (prefers-color-scheme:dark){:root{--bg:#1b1a2b;--card:#252439;--text:#eceaf5;--line:#3a3957;--muted:#a09eb5}body{background:var(--bg)!important;color:var(--text)!important}.card,input{background:var(--card)!important;color:var(--text)!important}button{background:var(--card);color:var(--text)}}
*{box-sizing:border-box}body{font:15px system-ui,"Segoe UI",sans-serif;margin:0;padding:20px;background:#f0f0f7;color:#242424}
h1{margin:0 0 2px;font-size:22px}.sub{color:var(--muted);margin:0 0 14px}h2{font-size:16px;margin:0 0 8px}
.card{background:#fff;border-radius:12px;padding:14px 16px;margin-bottom:12px;box-shadow:0 1px 3px #0002}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:7px 0;border-top:1px solid var(--line)}.row:first-of-type{border-top:0}.grow{flex:1;min-width:140px}.grow small{display:block;color:var(--muted)}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:#f5f5fa;padding:6px 12px}button.p{background:var(--brand);color:#fff;border:0;font-weight:600}button.d{color:#c4314b}
input[type=text],input[type=password]{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;min-width:0;flex:1}input:focus{outline:2px solid var(--brand)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#aaa;margin-right:6px}.dot.on{background:#13a10e}.muted{color:var(--muted);font-size:14px}.pill{font-size:11px;border:1px solid var(--line);border-radius:10px;padding:0 7px;margin-left:6px}
</style>
<h1>💬 LANChat sessions</h1><p class="sub">A session is one chat group. You can host several on this computer, and join friends' sessions.</p>
<div class="card"><h2>Your sessions <span class="muted">(hosted on this computer)</span></h2><div id="hosted"><p class="muted">None yet — create one below.</p></div>
<h2 style="margin-top:12px">Create a new session</h2>
<form id="newf" class="row" style="border:0"><input type="text" id="nname" placeholder="Session name, e.g. Friday Gang" maxlength="40" required>
<label class="muted"><input type="checkbox" id="nenc"> encrypt history</label><input type="password" id="npass" placeholder="Passphrase (8+ characters)" style="display:none"><button class="p" type="submit">Create &amp; open</button></form></div>
<div class="card"><h2>Sessions you joined</h2><div id="joined"><p class="muted">None yet.</p></div></div>
<div class="card"><h2>Find sessions on this Wi-Fi</h2><div id="found"><p class="muted">Looking…</p></div>
<form id="jf" class="row" style="border:0"><input type="text" id="jurl" placeholder="…or type an address, e.g. 192.168.1.23:3000"><button type="submit">Join</button></form></div>
<script>
const { ipcRenderer } = require('electron'); const $ = (s) => document.querySelector(s);
const b = (label, fn, cls) => { const x = document.createElement('button'); x.textContent = label; if (cls) x.className = cls; x.onclick = fn; return x; };
const row = (title, sub, ...btns) => { const r = document.createElement('div'); r.className = 'row'; const g = document.createElement('div'); g.className = 'grow'; g.append(title); if (sub) { const s = document.createElement('small'); s.textContent = sub; g.append(s); } r.append(g, ...btns); return r; };
$('#nenc').onchange = (e) => { $('#npass').style.display = e.target.checked ? '' : 'none'; };
$('#newf').onsubmit = async (e) => { e.preventDefault(); const r = await ipcRenderer.invoke('sessions:create', { name: $('#nname').value, passphrase: $('#nenc').checked ? $('#npass').value : '' }); if (r && r.error) alert(r.error); };
$('#jf').onsubmit = async (e) => { e.preventDefault(); if (!$('#jurl').value.trim()) return; const r = await ipcRenderer.invoke('sessions:join', $('#jurl').value); if (r && r.error) alert(r.error); };
async function draw() {
  const d = await ipcRenderer.invoke('sessions:list');
  const H = $('#hosted'), J = $('#joined'), F = $('#found'); H.replaceChildren(); J.replaceChildren(); F.replaceChildren();
  for (const s of d.hosted) { const t = document.createElement('span'); const dot = document.createElement('span'); dot.className = 'dot' + (s.running ? ' on' : ''); t.append(dot, s.name); if (s.encrypted) { const p = document.createElement('span'); p.className = 'pill'; p.textContent = '🔐 encrypted'; t.append(p); } if (s.id === d.active) { const p = document.createElement('span'); p.className = 'pill'; p.textContent = 'open now'; t.append(p); }
    H.append(row(t, s.running ? `Running · port ${s.port}` : 'Stopped', b('Open', () => ipcRenderer.invoke('sessions:open', s.id), 'p'), s.running ? b('Stop', () => ipcRenderer.invoke('sessions:stop', s.id)) : b('Start', () => ipcRenderer.invoke('sessions:start', s.id)), b('Delete…', () => ipcRenderer.invoke('sessions:delete', s.id), 'd'))); }
  if (!d.hosted.length) H.innerHTML = '<p class="muted">None yet — create one below.</p>';
  for (const s of d.joined) J.append(row(s.name || s.url, s.url + (s.id === d.active ? ' · open now' : ''), b('Open', () => ipcRenderer.invoke('sessions:open', s.id), 'p'), b('Forget', () => ipcRenderer.invoke('sessions:forget', s.id), 'd')));
  if (!d.joined.length) J.innerHTML = '<p class="muted">None yet.</p>';
  for (const f of d.discovered) F.append(row(f.name || 'LANChat', f.url + (f.self ? ' · this computer' : ''), f.self ? '' : b('Join', () => ipcRenderer.invoke('sessions:join', f.url), 'p')));
  if (!d.discovered.length) F.innerHTML = '<p class="muted">Looking… (none found yet — your friend must be hosting, on the same Wi-Fi)</p>';
}
draw(); setInterval(draw, 1500);
</script>
