<!doctype html><meta charset="utf-8"><title>LANChat sessions</title>
<style>
:root{--brand:#5b5fc7;--brand-d:#4f52b2;--bg:#f5f5f5;--card:#fff;--text:#242424;--muted:#616161;--line:#e0e0e0;--line2:#d1d1d1;--hover:#f0f0f0;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#1f1f1f;--card:#292929;--text:#fff;--muted:#adadad;--line:#3d3d3d;--line2:#525252;--hover:#333;color-scheme:dark}}
*{box-sizing:border-box}body{font:14px "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;margin:0;padding:20px;background:var(--bg);color:var(--text)}
.ic{width:18px;height:18px;flex:none;vertical-align:-4px}
button{font:inherit;font-weight:600;cursor:pointer;border-radius:4px;border:1px solid var(--line2);background:var(--card);color:var(--text);min-height:32px;padding:4px 12px;display:inline-flex;align-items:center;gap:6px}button:hover{background:var(--hover)}
button.p{background:var(--brand);color:#fff;border-color:transparent}button.p:hover{background:var(--brand-d)}button.d{color:#c4314b}
input[type=text],input[type=password]{font:inherit;min-height:32px;padding:5px 10px;border:1px solid var(--line2);border-bottom-color:var(--muted);border-radius:4px;background:var(--card);color:var(--text);min-width:0;flex:1}input:focus{outline:0;border-bottom:2px solid var(--brand)}
.muted{color:var(--muted)}
.head{display:flex;align-items:center;gap:12px;margin-bottom:16px}.head img{width:40px;height:40px}h1{margin:0;font-size:20px;font-weight:700}.sub{color:var(--muted);margin:2px 0 0}h2{font-size:15px;margin:0 0 8px;display:flex;align-items:center;gap:6px}
.card{background:var(--card);border-radius:8px;padding:14px 16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.12),0 0 1px rgba(0,0,0,.1)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--line)}.row:first-of-type{border-top:0}.grow{flex:1;min-width:140px;display:flex;flex-direction:column}.grow>span{display:flex;align-items:center;gap:6px;font-weight:600}.grow small{color:var(--muted)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#8a8886}.dot.on{background:#6bb700}.pill{font-size:11px;font-weight:600;border:1px solid var(--line2);border-radius:10px;padding:0 7px;display:inline-flex;align-items:center;gap:3px}.pill .ic{width:12px;height:12px}
</style>
<div class="head"><img src="public/icon.svg" alt=""><div><h1>LANChat sessions</h1><p class="sub">A session is one chat group. You can host several on this computer, and join friends' sessions.</p></div></div>
<div class="card"><h2><span data-ic="desktop"></span>Your sessions <span class="muted">(hosted on this computer)</span></h2><div id="hosted"><p class="muted">None yet — create one below.</p></div>
<h2 style="margin-top:14px"><span data-ic="add"></span>Create a new session</h2>
<form id="newf" class="row" style="border:0"><input type="text" id="nname" placeholder="Session name, e.g. Friday Gang" maxlength="40" required>
<label class="muted"><input type="checkbox" id="nenc"> encrypt history</label><input type="password" id="npass" placeholder="Passphrase (8+ characters)" style="display:none"><button class="p" type="submit"><span data-ic="add"></span>Create &amp; open</button></form></div>
<div class="card"><h2><span data-ic="people_team"></span>Sessions you joined</h2><div id="joined"><p class="muted">None yet.</p></div></div>
<div class="card"><h2><span data-ic="search"></span>Find sessions on this Wi-Fi</h2><div id="found"><p class="muted">Looking…</p></div>
<form id="jf" class="row" style="border:0"><input type="text" id="jurl" placeholder="…or type an address, e.g. 192.168.1.23:3000"><button type="submit"><span data-ic="arrow_enter"></span>Join</button></form></div>
<script src="public/js/icons.js"></script>
<script>
const { ipcRenderer } = require('electron');
const ic = (n) => (window.LC && LC.icon ? LC.icon(n) : document.createTextNode('')); for (const x of document.querySelectorAll('[data-ic]')) x.replaceWith(ic(x.dataset.ic)); const $ = (s) => document.querySelector(s);
const b = (label, fn, cls, icon) => { const x = document.createElement('button'); if (icon) x.append(ic(icon)); x.append(label); if (cls) x.className = cls; x.onclick = fn; return x; };
const row = (title, sub, ...btns) => { const r = document.createElement('div'); r.className = 'row'; const g = document.createElement('div'); g.className = 'grow'; g.append(title); if (sub) { const s = document.createElement('small'); s.textContent = sub; g.append(s); } r.append(g, ...btns); return r; };
$('#nenc').onchange = (e) => { $('#npass').style.display = e.target.checked ? '' : 'none'; };
$('#newf').onsubmit = async (e) => { e.preventDefault(); const r = await ipcRenderer.invoke('sessions:create', { name: $('#nname').value, passphrase: $('#nenc').checked ? $('#npass').value : '' }); if (r && r.error) alert(r.error); };
$('#jf').onsubmit = async (e) => { e.preventDefault(); if (!$('#jurl').value.trim()) return; const r = await ipcRenderer.invoke('sessions:join', $('#jurl').value); if (r && r.error) alert(r.error); };
async function draw() {
  const d = await ipcRenderer.invoke('sessions:list');
  const H = $('#hosted'), J = $('#joined'), F = $('#found'); H.replaceChildren(); J.replaceChildren(); F.replaceChildren();
  for (const s of d.hosted) { const t = document.createElement('span'); const dot = document.createElement('span'); dot.className = 'dot' + (s.running ? ' on' : ''); t.append(dot, s.name); if (s.encrypted) { const p = document.createElement('span'); p.className = 'pill'; p.append(ic('lock_closed'), 'encrypted'); t.append(p); } if (s.id === d.active) { const p = document.createElement('span'); p.className = 'pill'; p.textContent = 'open now'; t.append(p); }
    H.append(row(t, s.running ? `Running · port ${s.port}` : 'Stopped', b('Open', () => ipcRenderer.invoke('sessions:open', s.id), 'p', 'open'), s.running ? b('Stop', () => ipcRenderer.invoke('sessions:stop', s.id), '', 'record_stop') : b('Start', () => ipcRenderer.invoke('sessions:start', s.id), '', 'play'), b('Delete…', () => ipcRenderer.invoke('sessions:delete', s.id), 'd', 'delete'))); }
  if (!d.hosted.length) H.innerHTML = '<p class="muted">None yet — create one below.</p>';
  for (const s of d.joined) J.append(row(s.name || s.url, s.url + (s.id === d.active ? ' · open now' : ''), b('Open', () => ipcRenderer.invoke('sessions:open', s.id), 'p', 'open'), b('Forget', () => ipcRenderer.invoke('sessions:forget', s.id), 'd', 'dismiss')));
  if (!d.joined.length) J.innerHTML = '<p class="muted">None yet.</p>';
  for (const f of d.discovered) F.append(row(f.name || 'LANChat', f.url + (f.self ? ' · this computer' : ''), f.self ? '' : b('Join', () => ipcRenderer.invoke('sessions:join', f.url), 'p', 'arrow_enter')));
  if (!d.discovered.length) F.innerHTML = '<p class="muted">Looking… (none found yet — your friend must be hosting, on the same Wi-Fi)</p>';
}
draw(); setInterval(draw, 1500);
</script>
