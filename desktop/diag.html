<!doctype html><meta charset="utf-8"><title>Connection help</title>
<style>
:root{--brand:#5b5fc7;--brand-d:#4f52b2;--bg:#f5f5f5;--card:#fff;--text:#242424;--muted:#616161;--line:#e0e0e0;--line2:#d1d1d1;--hover:#f0f0f0;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#1f1f1f;--card:#292929;--text:#fff;--muted:#adadad;--line:#3d3d3d;--line2:#525252;--hover:#333;color-scheme:dark}}
*{box-sizing:border-box}body{font:14px "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;margin:0;padding:20px;background:var(--bg);color:var(--text)}
.ic{width:18px;height:18px;flex:none;vertical-align:-4px}
button{font:inherit;font-weight:600;cursor:pointer;border-radius:4px;border:1px solid var(--line2);background:var(--card);color:var(--text);min-height:32px;padding:4px 12px;display:inline-flex;align-items:center;gap:6px}button:hover{background:var(--hover)}
button.p{background:var(--brand);color:#fff;border-color:transparent}button.p:hover{background:var(--brand-d)}button.d{color:#c4314b}
input[type=text],input[type=password]{font:inherit;min-height:32px;padding:5px 10px;border:1px solid var(--line2);border-bottom-color:var(--muted);border-radius:4px;background:var(--card);color:var(--text);min-width:0;flex:1}input:focus{outline:0;border-bottom:2px solid var(--brand)}
.muted{color:var(--muted)}
body{background:var(--card)}h2{margin:0 0 6px;display:flex;align-items:center;gap:8px;font-size:18px}h3{font-size:15px}.ok{color:#13a10e}.bad{color:#c4314b}li{margin:6px 0;list-style:none;display:flex;gap:6px;align-items:flex-start}ul{padding-left:4px}#tips li{list-style:disc;display:list-item;margin-left:16px}
pre{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;white-space:pre-wrap;font-size:12px}
</style>
<h2><span data-ic="stethoscope"></span>Why can't my friend connect?</h2><p class="muted">Checking this computer…</p><ul id="r"></ul><h3>What to try</h3><ul id="tips"></ul><button class="p" id="re">Run again</button><button id="cp">Copy report</button><pre id="raw"></pre>
<script src="public/js/icons.js"></script>
<script>
const ic = (n, cls) => { const x = window.LC && LC.icon ? LC.icon(n, { cls }) : document.createElement('span'); return x; }; for (const x of document.querySelectorAll('[data-ic]')) x.replaceWith(ic(x.dataset.ic));
const { ipcRenderer, clipboard } = require('electron'); const R = document.getElementById('r');
async function run() { R.replaceChildren(); document.getElementById('tips').replaceChildren(); document.getElementById('raw').textContent = '…'; const d = await ipcRenderer.invoke('diag:run');
  for (const c of d.checks) { const li = document.createElement('li'); const tx = document.createElement('span'); tx.textContent = c.text; li.append(ic(c.ok ? 'checkmark_circle' : 'dismiss_circle', c.ok ? 'ok' : 'bad'), tx); R.append(li); }
  for (const t of d.tips) { const li = document.createElement('li'); li.textContent = t; document.getElementById('tips').append(li); } document.getElementById('raw').textContent = d.raw; window.__raw = d.raw; }
document.getElementById('re').onclick = run; document.getElementById('cp').onclick = () => clipboard.writeText(window.__raw || ''); run();
</script>
