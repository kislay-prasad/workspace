<!doctype html><meta charset="utf-8"><title>Unlock session</title>
<style>
:root{--brand:#5b5fc7;--brand-d:#4f52b2;--bg:#f5f5f5;--card:#fff;--text:#242424;--muted:#616161;--line:#e0e0e0;--line2:#d1d1d1;--hover:#f0f0f0;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#1f1f1f;--card:#292929;--text:#fff;--muted:#adadad;--line:#3d3d3d;--line2:#525252;--hover:#333;color-scheme:dark}}
*{box-sizing:border-box}body{font:14px "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;margin:0;padding:20px;background:var(--bg);color:var(--text)}
.ic{width:18px;height:18px;flex:none;vertical-align:-4px}
button{font:inherit;font-weight:600;cursor:pointer;border-radius:4px;border:1px solid var(--line2);background:var(--card);color:var(--text);min-height:32px;padding:4px 12px;display:inline-flex;align-items:center;gap:6px}button:hover{background:var(--hover)}
button.p{background:var(--brand);color:#fff;border-color:transparent}button.p:hover{background:var(--brand-d)}button.d{color:#c4314b}
input[type=text],input[type=password]{font:inherit;min-height:32px;padding:5px 10px;border:1px solid var(--line2);border-bottom-color:var(--muted);border-radius:4px;background:var(--card);color:var(--text);min-width:0;flex:1}input:focus{outline:0;border-bottom:2px solid var(--brand)}
.muted{color:var(--muted)}
body{background:var(--card);padding:22px}h2{margin:0 0 6px;display:flex;align-items:center;gap:8px;font-size:18px}p{margin:0 0 12px;color:var(--muted)}input{width:100%;font-size:15px}.row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}.err{color:#c4314b;min-height:1.2em}
</style>
<h2><span data-ic="lock_closed"></span><span id="t">Unlock session</span></h2><p>This session's history is encrypted. Enter its passphrase to start it.</p><div class="err" id="e"></div>
<form id="f"><input id="p" type="password" autofocus autocomplete="off" placeholder="Passphrase"><div class="row"><button type="button" id="c">Cancel</button><button class="p" type="submit">Unlock</button></div></form>
<script src="public/js/icons.js"></script>
<script>
for (const x of document.querySelectorAll('[data-ic]')) x.replaceWith(window.LC && LC.icon ? LC.icon(x.dataset.ic) : document.createElement('span'));
const { ipcRenderer } = require('electron'); const q = new URLSearchParams(location.search), id = q.get('id');
document.getElementById('t').textContent = q.get('title') || 'Unlock session'; if (q.get('bad')) document.getElementById('e').textContent = 'That passphrase was wrong. Try again.';
document.getElementById('f').onsubmit = (e) => { e.preventDefault(); ipcRenderer.send('pp:' + id, document.getElementById('p').value); };
document.getElementById('c').onclick = () => ipcRenderer.send('pp:' + id, null);
</script>
