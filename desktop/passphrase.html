<!doctype html><meta charset="utf-8"><title>Unlock session</title>
<style>body{font:15px system-ui,"Segoe UI",sans-serif;margin:0;padding:22px;background:#fff;color:#242424}h2{margin:0 0 6px}p{margin:0 0 12px;color:#6b6b7b}input{width:100%;box-sizing:border-box;padding:10px 12px;font-size:16px;border:1px solid #d1d1db;border-radius:8px}input:focus{outline:2px solid #5b5fc7}.row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}button{padding:8px 16px;border-radius:8px;border:1px solid #d1d1db;background:#f5f5fa;font-size:15px;cursor:pointer}button.p{background:#5b5fc7;color:#fff;border:0}.err{color:#c4314b;min-height:1.2em}
@media (prefers-color-scheme:dark){body{background:#1b1a2b;color:#eceaf5}input,button{background:#252439;color:#eceaf5;border-color:#3a3957}}</style>
<h2 id="t">🔐 Unlock session</h2><p>This session's history is encrypted. Enter its passphrase to start it.</p><div class="err" id="e"></div>
<form id="f"><input id="p" type="password" autofocus autocomplete="off" placeholder="Passphrase"><div class="row"><button type="button" id="c">Cancel</button><button class="p" type="submit">Unlock</button></div></form>
<script>
const { ipcRenderer } = require('electron'); const q = new URLSearchParams(location.search), id = q.get('id');
document.getElementById('t').textContent = '🔐 ' + (q.get('title') || 'Unlock session'); if (q.get('bad')) document.getElementById('e').textContent = 'That passphrase was wrong. Try again.';
document.getElementById('f').onsubmit = (e) => { e.preventDefault(); ipcRenderer.send('pp:' + id, document.getElementById('p').value); };
document.getElementById('c').onclick = () => ipcRenderer.send('pp:' + id, null);
</script>
